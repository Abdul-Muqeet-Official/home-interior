<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Reviews – HomeInteriorKarachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { white: '#FAFAFC', pure: '#FFFFFF', gold: '#C5A880', champagne: '#F7F4F0', charcoal: '#121214', slate: '#1E1E24' } }, fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
    };
  </script>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-brand-white text-brand-slate antialiased">
  <!-- Header same as other pages -->
  <header class="fixed top-0 left-0 w-full z-50 glass-header py-4">
    <div class="container mx-auto px-6 md:px-12 flex justify-between items-center">
      <a href="../index.html" class="flex items-center gap-3 group">
        <div class="w-12 h-12 rounded-full flex items-center justify-center border border-brand-gold text-brand-gold font-serif text-2xl group-hover:bg-brand-gold group-hover:text-white transition-colors">H</div>
        <div>
          <h1 class="font-serif text-lg md:text-xl font-semibold uppercase tracking-wide">HOME INTERIOR</h1>
          <p class="text-xs text-brand-gold uppercase tracking-wider">KARACHI — BESPOKE LIVING STUDIO</p>
        </div>
      </a>
    </div>
  </header>

  <main class="pt-24 container mx-auto px-6 md:px-12 py-12">
    <h2 class="font-serif text-3xl md:text-4xl text-center mb-8">What Our Clients Say</h2>
    <!-- Carousel container -->
    <div class="relative overflow-hidden">
      <div id="reviews-carousel" class="flex transition-transform duration-500"></div>
      <div id="reviews-dots" class="flex justify-center space-x-2 mt-4"></div>
    </div>

    <!-- Submission Form -->
    <section class="mt-12 max-w-xl mx-auto">
      <h3 class="font-serif text-2xl mb-4 text-center">Leave a Review</h3>
      <form id="review-form" class="grid gap-4">
        <input type="text" id="name" placeholder="Your Name" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-gold" required />
        <input type="text" id="location" placeholder="Location" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-gold" required />
        <select id="rating" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-gold" required>
          <option value="" disabled selected>Rating (1-5)</option>
          <option value="1">1 – Poor</option>
          <option value="2">2 – Fair</option>
          <option value="3">3 – Good</option>
          <option value="4">4 – Very Good</option>
          <option value="5">5 – Excellent</option>
        </select>
        <textarea id="quote" rows="3" placeholder="Your feedback" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-gold" required></textarea>
        <button type="submit" class="bg-brand-gold text-brand-charcoal py-2 rounded hover:bg-brand-gold/80 font-medium">Submit Review</button>
      </form>
    </section>
  </main>

  <footer class="bg-brand-white py-8 border-t border-gray-200 text-center text-xs text-gray-500 mt-12">
    © 2026 HomeInteriorKarachi. All rights reserved.
  </footer>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/reviews.js"></script>
</body>
</html>
