<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Material study — stone, plaster and oak review under studio light" preserveAspectRatio="xMidYMid slice">
  <defs>
  <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6d6154" stop-opacity="1" />
    <stop offset="50%" stop-color="#4a4238" stop-opacity="1" />
    <stop offset="100%" stop-color="#241f1a" stop-opacity="1" />
  </linearGradient>
  <radialGradient id="bsGlow" cx="34%" cy="30%" r="72%">
    <stop offset="0%" stop-color="#f3e0bd" stop-opacity="0.5" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <filter id="bandStoneGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="1600" height="1000" filter="url(#bandStoneGrain)" opacity="0.3" style="mix-blend-mode:soft-light" />
  </defs>
  <rect width="1600" height="1000" fill="url(#bs)" />
  <rect width="1600" height="1000" fill="url(#bsGlow)" />
  <g>
    <rect x="0" y="0" width="1200" height="360" fill="#59503f" opacity="0.45" />
    <rect x="0" y="360" width="1200" height="4" fill="#efe0c4" opacity="0.25" />
    <rect x="0" y="364" width="900" height="300" fill="#3c352c" opacity="0.5" />
    <rect x="900" y="364" width="700" height="636" fill="#2b2621" opacity="0.55" />
    <rect x="0" y="664" width="900" height="336" fill="#4c4238" opacity="0.45" />
    <rect x="1180" y="120" width="2" height="760" fill="#efe0c4" opacity="0.25" />
    <rect x="1280" y="180" width="2" height="700" fill="#efe0c4" opacity="0.16" />
  </g>
</svg>
