<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Plaster texture study" preserveAspectRatio="xMidYMid slice">
  <defs>
  <linearGradient id="tp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#efe8dc" stop-opacity="1" />
    <stop offset="50%" stop-color="#ded3c2" stop-opacity="1" />
    <stop offset="100%" stop-color="#c9bda9" stop-opacity="1" />
  </linearGradient>
  <radialGradient id="tpGlow" cx="30%" cy="24%" r="76%">
    <stop offset="0%" stop-color="#fffdf8" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <filter id="tpGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="1600" height="1000" filter="url(#tpGrain)" opacity="0.34" style="mix-blend-mode:soft-light" />
