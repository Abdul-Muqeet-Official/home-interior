<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Carpet tile material texture">
  <defs>
    <pattern id="pile" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#C5A880"/>
      <path d="M0 8 L8 0" stroke="#B2966E" stroke-width="1.4" opacity="0.55"/>
      <path d="M0 0 L8 8" stroke="#D7C1A0" stroke-width="1.2" opacity="0.5"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#121214" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#pile)"/>
  <g stroke="#121214" stroke-opacity="0.22" fill="none">
    <path d="M0 500 H1200"/>
    <path d="M0 1000 H1200"/>
    <path d="M400 0 V1500"/>
    <path d="M800 0 V1500"/>
  </g>
  <rect width="1200" height="1500" fill="url(#shade)"/>
</svg>
