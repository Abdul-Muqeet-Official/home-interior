<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Light study — daylight across plaster, stone and ribbed timber surfaces" preserveAspectRatio="xMidYMid slice">
  <defs>
  <linearGradient id="bl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7f2e9" stop-opacity="1" />
    <stop offset="55%" stop-color="#e6d9c4" stop-opacity="1" />
    <stop offset="100%" stop-color="#cdb996" stop-opacity="1" />
  </linearGradient>
  <radialGradient id="blGlow" cx="72%" cy="22%" r="80%">
    <stop offset="0%" stop-color="#fffaf0" stop-opacity="0.85" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <filter id="bandLightGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="1600" height="1000" filter="url(#bandLightGrain)" opacity="0.28" style="mix-blend-mode:soft-light" />
  </defs>
  <rect width="1600" height="1000" fill="url(#bl)" />
  <rect width="1600" height="1000" fill="url(#blGlow)" />
  <g opacity="0.5">
    <rect x="120" y="140" width="420" height="640" fill="#ffffff" opacity="0.35" />
    <rect x="120" y="140" width="420" height="640" fill="none" stroke="#8d7454" stroke-opacity="0.35" />
    <rect x="600" y="220" width="300" height="560" fill="#b99d78" opacity="0.35" />
    <rect x="960" y="180" width="520" height="600" fill="#4f4436" opacity="0.28" />
    <rect x="960" y="180" width="520" height="600" fill="none" stroke="#ffffff" stroke-opacity="0.3" />
  </g>
  <rect x="0" y="780" width="1600" height="2" fill="#8d7454" opacity="0.4" />
</svg>
